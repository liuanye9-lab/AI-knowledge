<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI 伴学的飞书互动卡片体验：把会议内容变成可交接行动。" />
  <title>AI 伴学 · 飞书工作卡片</title>
  <link rel="stylesheet" href="css/companion.css" />
</head>
<body class="companion-page">
  <div class="work-canvas">
    <aside class="work-rail" aria-label="工作应用"><i>AI</i><i class="active">聊</i><i>会</i><i>文</i><i>云</i></aside>
    <main class="work-main">
      <header class="work-head"><h1>项目沟通群</h1><p>Card 2.0 原型 · CLI 桥接已就绪</p></header>
      <section class="chat-stage">
        <article class="feishu-card" id="work-card" aria-labelledby="card-title">
          <div class="card-accent"></div>
          <div class="feishu-card-inner">
            <h2 id="card-title">会议结束了，先把行动留下</h2>
            <p class="card-summary" id="card-summary">识别到 4 个行动项，其中 2 个还没有负责人。</p>
            <div class="action-list">
              <div class="action-item"><span class="action-dot"></span><div><strong>整理并分享客户反馈摘要</strong><small>截止：本周五</small></div><button class="owner-button" type="button" data-task="0">负责人：待定</button></div>
              <div class="action-item"><span class="action-dot"></span><div><strong>确认试点用户名单并发起访谈</strong><small>截止：下周三</small></div><button class="owner-button" type="button" data-task="1">负责人：待定</button></div>
            </div>
            <div class="owner-picker" id="owner-picker" aria-live="polite"><p>谁更适合接住这件事？</p><div class="owner-options"><button type="button">产品负责人</button><button type="button">客户成功</button><button type="button">项目经理</button></div></div>
            <button class="card-primary" id="confirm-actions" type="button">补全并确认</button>
            <button class="later-button" id="later-action" type="button">稍后提醒我</button>
            <p class="learned-line"><span aria-hidden="true">❧</span><span>这次学到：任务最好同时包含负责人、截止时间和完成标准。</span></p>
          </div>
        </article>
      </section>
    </main>
  </div>
  <script src="js/feishu-companion.js"></script>
</body>
</html>
