<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 伴学 · 新标签页</title>
  <link rel="stylesheet" href="../css/companion.css" />
</head>
<body class="companion-page newtab-page">
  <main class="newtab-shell">
    <header class="quiet-brand"><img src="icons/icon-48.png" alt="" /><span>AI 伴学</span></header>
    <section class="newtab-focus" aria-labelledby="newtab-title">
      <div class="newtab-copy">
        <p class="moment-label" id="time-label">今天</p>
        <h1 id="newtab-title">今天，先完成一件重要的事</h1>
        <p class="newtab-instruction">打开你正在处理的页面，点击右上角 AI 伴学。我会直接看当前内容，只给你一个最值得采用的建议。</p>
        <button class="companion-primary newtab-action" id="open-companion" type="button">打开浏览器侧边栏</button>
      </div>
      <img class="newtab-art" src="../images/product/newtab-action-watercolor.webp" alt="水彩画：工作者从熟悉的资料走向一个清晰行动" width="1536" height="1024" fetchpriority="high" />
    </section>
    <aside class="remember-line" id="remember-line">
      <div><small>上次留下的方法</small><p id="remember-text">先说目标，再给背景，最后约束输出。</p></div>
      <button id="dismiss-memory" type="button">今天不看</button>
    </aside>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
