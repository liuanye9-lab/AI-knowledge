<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 伴学 · 侧边栏</title>
  <link rel="stylesheet" href="../css/companion.css" />
</head>
<body class="companion-page sidepanel-page">
  <main class="sidepanel-shell">
    <header class="sidepanel-head">
      <a href="../companion.html" class="quiet-brand"><img src="icons/icon-48.png" alt="" /><span>AI 伴学</span></a>
      <span class="context-status" id="context-status">正在看当前页面</span>
    </header>

    <section class="context-block" aria-labelledby="context-title">
      <p class="micro-label" id="context-title">正在陪你处理</p>
      <p class="context-summary" id="context-summary">正在读取你刚刚打开的内容…</p>
      <p class="source-line" id="source-line">当前页面</p>
      <p class="privacy-line">只处理你主动打开侧边栏时的选区或当前页面摘要。</p>
    </section>

    <section class="suggestion-block is-loading" id="suggestion-block" aria-live="polite">
      <p class="micro-label">最值得先改的一点</p>
      <h1 id="suggestion-title">正在找到一个最值得采用的建议…</h1>
      <div class="rewrite-block">
        <p class="micro-label">可以直接使用</p>
        <p id="rewrite-text">稍等片刻，我会把结果直接放在这里。</p>
      </div>
      <button id="apply-btn" class="companion-primary full" type="button" disabled>复制这个版本</button>
      <p class="why-line"><span id="why-text">完成后，我只用一句话告诉你为什么有效。</span></p>
      <button id="save-method" class="save-method" type="button" disabled>留给下次</button>
      <button id="retry-btn" class="retry-button" type="button">再看一次当前页面</button>
    </section>

    <footer class="sidepanel-foot"><span id="model-label">正在检查模型连接</span><a href="../learning.html">需要时再看原理</a></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
